<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#ffffff">
  <title>Map implementation · Buggy Maps</title>
  <link rel="icon" type="image/png" href="../assets/buggy-icon.png">
  <link rel="stylesheet" href="./viewer.css">
  <script type="module" src="./viewer.js"></script>
</head>
<body data-own-language>
  <header><div class="bar"><a id="brand" href="../" aria-label="Buggy Maps"><img src="../assets/buggy-logo.png" alt="Buggy" width="287" height="100"></a>
    <nav aria-label="Navigation"><button type="button" id="language">Español</button><a id="back" href="../">Back to map</a></nav></div></header>
  <main>
    <h1 id="title">Map implementation</h1>
    <p class="intro" id="description">Choose a feature to read or download the code running on the public map.</p>
    <section aria-labelledby="feature-label">
      <div class="toolbar"><label for="feature" id="feature-label">Feature</label><div class="controls"><select id="feature"></select><a id="download" hidden download>Download file</a></div></div>
      <div class="source">
        <div class="filename"><strong id="file"></strong><span id="status" role="status" aria-live="polite"></span></div>
        <button type="button" id="retry" hidden>Retry</button>
        <pre id="code-view" tabindex="0" aria-label="Source code"><code id="code" translate="no"></code></pre>
      </div>
    </section>
    <noscript>Open this page in a browser with JavaScript to read the source files.</noscript>
  </main>
</body>
</html>
