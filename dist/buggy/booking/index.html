<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#fff">
  <meta name="robots" content="noindex,nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Parent booking · Buggy Maps</title>
  <link rel="icon" href="../assets/buggy-icon.png" type="image/png">
  <link rel="stylesheet" href="../service/service.css">
  <script type="module" src="./booking.js"></script>
</head>
<body data-booking-handoff>
  <header>
    <a class="identity" href="../"><img src="../assets/buggy-logo.png" width="116" height="40" alt="Buggy"></a>
    <div class="top-actions"><button type="button" id="language">Español</button></div>
  </header>
  <main>
    <p class="eyebrow" id="label">For parents and guardians</p>
    <h1 id="heading">Open Buggy’s booking site?</h1>
    <p class="lead" id="details"></p>
    <div class="actions">
      <a class="action" id="back" href="../">Back to map</a>
      <button type="button" id="confirm" class="primary" disabled>I’m a parent or guardian. Continue</button>
    </div>
    <noscript>Enable JavaScript to review the official destination before continuing.</noscript>
  </main>
</body>
</html>
